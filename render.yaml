services:
  - type: web
    name: glowbook-uganda
    runtime: python
    plan: free
    buildCommand: bash build.sh
    startCommand: gunicorn shamse.wsgi:application --bind 0.0.0.0:$PORT
    envVars:
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: glowbook-uganda.onrender.com
      - key: DATABASE_URL
        fromDatabase:
          name: glowbook-uganda-db
          property: connectionString

databases:
  - name: glowbook-uganda-db
    databaseName: glowbookuganda
    user: glowbookuganda
    plan: free
